<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="100%" height="100%">
  <defs>
    <linearGradient id="tivGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97101" />
      <stop offset="100%" stop-color="#018B11" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Icon Mark -->
  <g transform="translate(10, 10)">
    <!-- Shield / Triangle Dynamic Icon -->
    <path d="M 15 15 L 45 15 L 65 50 L 35 75 L 15 50 Z" fill="#18033E" stroke="#F97101" stroke-width="3"/>
    <!-- Growth Arrow -->
    <path d="M 25 55 L 45 30 L 60 40 L 75 18" fill="none" stroke="#018B11" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 62 18 L 75 18 L 75 31" fill="none" stroke="#018B11" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Dot Highlight -->
    <circle cx="45" cy="30" r="4" fill="#F97101" />
  </g>
  
  <!-- Brand Text -->
  <text x="105" y="52" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" letter-spacing="1" fill="#FEFEFE">
    TIV
  </text>
  
  <text x="105" y="74" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" letter-spacing="3" fill="#F97101">
    DIGITAL MARKETING
  </text>
  
  <!-- Green Growth Pill Accent -->
  <rect x="285" y="32" width="60" height="20" rx="10" fill="#018B11" opacity="0.9" />
  <text x="315" y="46" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="10" fill="#FEFEFE" text-anchor="middle">
    AGENCY
  </text>
</svg>
